version: 2

semantic_models:
  - name: sales_semantic_model
    description: "Semantic layer definition for sales fact table"
    model: ref('fact_sales')   # base model
    entities:
      - name: order
        type: primary
        expr: order_pk
      - name: customer
        type: foreign
        expr: customer_pk
      - name: supplier
        type: foreign
        expr: supplier_pk
      - name: part
        type: foreign
        expr: part_pk

    defaults:
      agg_time_dimension: orderdate   # default time dimension for measures

    dimensions:
      - name: orderdate
        type: time
        type_params:
          time_granularity: day
      - name: orderstatus
        type: categorical
      - name: customer_name
        type: categorical
      - name: customer_mktsegment
        type: categorical
      - name: supplier_name
        type: categorical
      - name: part_name
        type: categorical
      - name: part_type
        type: categorical
      - name: part_brand
        type: categorical

    measures:
      - name: total_sales
        description: "Sum of extended price (before discount and tax)"
        agg: sum
        expr: extendedprice
      - name: total_discount
        description: "Sum of discounts on orders"
        agg: sum
        expr: discount
      - name: total_quantity
        description: "Total number of items sold"
        agg: sum
        expr: quantity
      - name: avg_tax
        description: "Average tax across sales"
        agg: average
        expr: tax
      - name: total_revenue
        description: "Revenue after discount and tax"
        agg: sum
        expr: (extendedprice * (1 - discount) * (1 + tax))
