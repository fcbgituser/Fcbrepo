version: 2

models:
  - name: sat_order_customer_details
    description: "Satellite storing customer details."
    columns:
      - name: customer_pk
        description: "Hub Customer reference."
      - name: customer_hashdiff
        description: "Hashdiff for customer attributes."
      - name: customer_name
        description: "Customer name."
      - name: customer_address
        description: "Customer address."
      - name: customer_phone
        description: "Phone number."
      - name: customer_accbal
        description: "Account balance."
      - name: customer_mktsegment
        description: "Market segment."
