version: 2

models:
  - name: sat_order_customer_details
    tests:
      - ReconcileTestSatsStage:
           BK: CUSTOMERKEY
           HK: CUSTOMER_PK
           stage: v_stg_orders
    description: "Satellite storing customer details."
    columns:
      - name: customer_pk
        description: "Hub Customer reference."
      - name: customer_hashdiff
        description: "Hashdiff for customer attributes."
      - name: customer_name
        description: "Customer name."
      - name: customer_address
        description: "Customer address."
      - name: customer_phone
        description: "Phone number."
      - name: customer_accbal
        description: "Account balance."
      - name: customer_mktsegment
        description: "Market segment."
      - name: customer_comment
        description: "Customer comments."
      - name: effective_from
        description: "Effective date for SCD2 changes."
      - name: ldts
        description: "Load timestamp."
      - name: rsrc
        description: "Source system."

  - name: sat_order_lineitem_details
    description: "Satellite storing order lineitem details."
    columns:
      - name: lineitem_pk
        description: "Hub Lineitem reference."
      - name: lineitem_hashdiff
        description: "Hashdiff for lineitem attributes."
      - name: commitdate
        description: "Commit date."
      - name: discount
        description: "Discount applied."
      - name: extendedprice
        description: "Extended price."
      - name: line_comment
        description: "Line comment."
      - name: quantity
        description: "Quantity ordered."
      - name: receiptdate
        description: "Receipt date."
      - name: returnflag
        description: "Return flag."
      - name: shipdate
        description: "Ship date."
      - name: shipinstruct
        description: "Shipping instructions."
      - name: shipmode
        description: "Shipping mode."
      - name: tax
        description: "Tax applied."
      - name: effective_from
        description: "Effective date."
      - name: ldts
        description: "Load timestamp."
      - name: rsrc
        description: "Source system."

  - name: sat_order_order_details
    description: "Satellite storing order header details."
    columns:
      - name: order_pk
        description: "Hub Order reference."
      - name: order_hashdiff
        description: "Hashdiff for order attributes."
      - name: orderstatus
        description: "Order status."
        tests:
          - elementary.column_anomalies:
              column_anomalies:
                - distinct_count
                - null_count
              anomaly_sensitivity: 3
              time_bucket:
                period: day
                count: 1
      - name: totalprice
        description: "Total order price."
        tests:
          - elementary.ai_data_validation: expectation_prompt: | "Validate the TOTALPRICE value for a single order row. Expectations: 1) TOTALPRICE must be numeric (no text). 2) TOTALPRICE must be >= 0 (non-negative). 3) Treat extremely large values (> 1000000) as suspicious/outliers to be flagged. 4) If TOTALPRICE is NULL, return FAIL with reason NULL_TOTAL unless the business explicitly allows NULL for this order. Output: - Return PASS if the value meets the expectations. - Otherwise return FAIL and a short explanation NEGATIVE_VALUE: -12.50, NON_NUMERIC: 12"
        
          - elementary.column_anomalies:
              column_anomalies:
                - average
                - null_count
              # filters rows to include in the metric (optional)
              where_expression: "ORDERSTATUS NOT IN ('(unknow)')"
              anomaly_sensitivity: 2      
              time_bucket:
                period: day
                count: 1
      - name: orderdate
        description: "Order date."
      - name: orderpriority
        description: "Order priority."
      - name: clerk
        description: "Order clerk."
      - name: shippriority
        description: "Shipping priority."
      - name: order_comment
        description: "Order comments."
      - name: effective_from
        description: "Effective date."
      - name: ldts
        description: "Load timestamp."
      - name: rsrc
        description: "Source system."
    config:
      elementary:
        # the column Elementary will use as the event/timestamp for time-bucketed checks
        timestamp_column: 'ldts'


  - name: sat_inv_inventory_details
    description: "Satellite storing inventory details."
    tests:
      - reconcile_metric_sums:
           source_relation: "v_stg_inventory"
           target_relation: "sat_inv_inventory_details"  # fully-qualified target
           metric_cols: ['AVAILQTY','SUPPLYCOST']
           metric_tolerance_pct: 0.0
           absolute_threshold: 0.0
    columns:
      - name: inventory_pk
        description: "Hub Inventory reference."
      - name: inventory_hashdiff
        description: "Hashdiff for inventory attributes."
      - name: availqty
        description: "Available quantity."
      - name: supplycost
        description: "Supply cost."
      - name: part_supply_comment
        description: "Part supply comments."
